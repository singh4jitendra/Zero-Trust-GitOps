# A plain Kubernetes Secret. base64 is encoding, NOT encryption.
# Any process on the node with the right permissions can read this from
# /var/lib/kubelet/pods/<uid>/volumes/kubernetes.io~secret/db-key/db-key
# That includes the cloud operator. THIS is what CoCo prevents in demo 2.
apiVersion: v1
kind: Secret
metadata:
  name: bank-db-key
  namespace: bank-insecure
  labels:
    demo: insecure
type: Opaque
stringData:
  db-key: "s3cr3tDBkey-DEMO1-leaks-this-to-the-host"
