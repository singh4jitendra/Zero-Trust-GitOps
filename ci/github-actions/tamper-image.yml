# =============================================================================
# Adversarial CI for the TAMPERED bank-api image.
# This workflow exists to demonstrate the attack: the attacker can push a
# malicious image, but cannot forge a valid Sigstore signature from the
# legitimate workflow identity — so Kyverno blocks it in demo 2.
#
# Run manually (workflow_dispatch). NOT triggered on push.
# =============================================================================
name: tamper-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # NO id-token / attestations — the attacker has no signing identity.

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bank-api

jobs:
  build-tampered:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push TAMPERED image (UNSIGNED)
        uses: docker/build-push-action@v6
        with:
          context: poc/app
          file: poc/app/Dockerfile
          push: true
          build-args: |
            IMAGE_VARIANT=tampered
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:tampered
