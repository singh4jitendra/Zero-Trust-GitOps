# =============================================================================
# Secure CI for the CLEAN bank-api image.
# Matches the deck's "Supply Chain Security with Sigstore" slide:
#   - Keyless signing (no long-lived keys)
#   - Identity-based verification (GitHub OIDC -> Fulcio)
#   - SLSA Build L3 provenance attestation
# The resulting image+signature+attestation is what Kyverno verifies at
# admission in the cluster.
# =============================================================================
name: build-sign-provenance

on:
  push:
    branches: [main]
    paths:
      - "poc/app/**"
      - ".github/workflows/build-sign-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write          # required for Sigstore keyless OIDC
  attestations: write      # required for SLSA provenance attestation

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bank-api

jobs:
  build-sign:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Build & push (CLEAN variant only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: poc/app
          file: poc/app/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            IMAGE_VARIANT=clean
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:clean
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Cosign keyless sign (OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify signature locally (sanity check)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/build-sign-provenance.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
