# Intentionally an EMPTY secret. The real value never sits in etcd or git.
# The attestation-agent init container in deployment.yaml fetches the value
# from the Trustee/KBS at pod start and writes it to a tmpfs volume that is
# only visible inside the CVM.
#
# We keep this resource in git so Argo CD reports it as a managed object;
# the actual material lives in the KMS/Vault behind the Trustee.
apiVersion: v1
kind: Secret
metadata:
  name: bank-db-key-placeholder
  namespace: bank-secure
  labels:
    demo: secure
  annotations:
    secrets.trustee.io/resource-id: "default/bank-db-key/v1"
    secrets.trustee.io/release-policy: "tee-evidence-required"
type: Opaque
stringData:
  README: "value released by Trustee post-attestation; see deployment.yaml"
