# Disallow mounting plain k8s Secrets as files in the secure namespace.
# In bank-secure all sensitive material must come from the Trustee/KBS.
apiVersion: kyverno.io/v2beta1
kind: ClusterPolicy
metadata:
  name: disallow-plain-secret-mounts
  annotations:
    policies.kyverno.io/title: Disallow plain Secret mounts in regulated namespaces
    policies.kyverno.io/category: Confidential Computing
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-plain-secret-volumes
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["bank-secure"]
      validate:
        message: >-
          Plain Secret volumes are not allowed in bank-secure. Use the Trustee
          attestation-agent init container to fetch sensitive data into a
          tmpfs volume that exists only inside the CVM.
        deny:
          conditions:
            any:
              # Guard with || `[]` so JMESPath returns an empty array (not nil)
              # when the pod has no .spec.volumes at all.
              - key: "{{ request.object.spec.volumes[?secret != null] || `[]` | length(@) }}"
                operator: GreaterThan
                value: 0
